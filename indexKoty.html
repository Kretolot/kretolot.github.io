<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link rel="stylesheet" href="styl.css">
    <title>Meow Meow Meow</title>
</head>
<body>
    <nav>
        <a href="index.html">Kwiatki</a>
        <a href="indexKoty.html" aria-current="page">Kotki i pieski</a>
    </nav>
    <header>
        <h1>Zwierzątka małe i mniejsze</h1>
    </header>

    <main class="gallery"></main>
    <div class="lightbox" id="lightbox">
        <img alt="">
    </div>
    <script>
    const gallery = document.querySelector('.gallery');
    const sets = [
        { name: 'salvaje', count: 13 },
        { name: 'rojo', count: 12 },
        { name: 'slodziak', count: 9 },
        { name: 'zoltan', count: 10 },
        { name: 'dingo', count: 1 }
    ];

    const images = [];
    for (const set of sets) {
        for (let i = 1; i <= set.count; i++) {
            const img = document.createElement('img');
            img.src = `pictures/${set.name}${i}.jpg`;
            img.alt = `${set.name} ${i}`;
            img.loading = 'lazy';
            images.push(img);
        }
    }

    for (let i = images.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [images[i], images[j]] = [images[j], images[i]];
    }

    images.forEach(img => gallery.appendChild(img));
</script>
</body>
</html>
