<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="logo.png">
<title>Meow Meow Meow</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f4eff6; --ink: #3b2f47; --muted: #7a6c88;
  --btn-bg: #3b2f47; --btn-fg: #f4eff6;
  --c0: #ff8fc2; --c1: #f5559f; --c2: #ffb3d6; --c3: #d92a7e; --c4: #ee75b3;
  --c5: #3a9a58; --c6: #8b7a9e; --c7: #d8407a; --c8: #a99bb8; --c9: #2f8a4c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19141f; --ink: #efe7f5; --muted: #a596b5;
    --btn-bg: #efe7f5; --btn-fg: #19141f;
    --c5: #62c07a; --c6: #bba9d0; --c7: #ff6aa0; --c8: #8f81a0; --c9: #4fae6a;
  }
}
:root[data-theme="dark"] {
  --bg: #19141f; --ink: #efe7f5; --muted: #a596b5;
  --btn-bg: #efe7f5; --btn-fg: #19141f;
  --c5: #62c07a; --c6: #bba9d0; --c7: #ff6aa0; --c8: #8f81a0; --c9: #4fae6a;
}
:root[data-pal="1"] { --c0: #ff9aa9; --c1: #f0607a; --c2: #ffc0c8; --c3: #d2406a; --c4: #e8809a; }
:root[data-pal="2"] { --c0: #e48ae8; --c1: #c653c8; --c2: #f0b4f2; --c3: #a63aa8; --c4: #d878dc; }

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1rem; padding: 1.25rem 16px 2rem;
  font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  -webkit-tap-highlight-color: transparent;
}
h1 { margin: 0; font-size: 2rem; font-weight: 500; font-style: italic; }
.hint { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; text-align: center; }
#bouquet {
  margin: 0; display: inline-block; white-space: pre; overflow: hidden;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-weight: 700; font-size: 12px; line-height: 1.08;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
#bouquet i { font-style: normal; }
.c0 { color: var(--c0); } .c1 { color: var(--c1); } .c2 { color: var(--c2); } .c3 { color: var(--c3); } .c4 { color: var(--c4); }
.c5 { color: var(--c5); } .c6 { color: var(--c6); } .c7 { color: var(--c7); } .c8 { color: var(--c8); } .c9 { color: var(--c9); }
button {
  font: inherit; font-size: 1rem; color: var(--btn-fg); background: var(--btn-bg);
  border: 0; border-radius: 999px; padding: 0.7rem 1.4rem; min-height: 44px; cursor: pointer;
}
button:focus-visible, #bouquet:focus-visible { outline: 3px solid var(--c1); outline-offset: 3px; }
</style>
</head>
<body>
<h2>Tulipanki</h2>
<h3>Jebać i się nie bać</h3>
<pre id="bouquet" role="img" aria-label="A spinning bouquet of five ASCII tulips wrapped in paper with a ribbon" tabindex="0"></pre>
<p class="hint">Kliknij guziora i zmien kolora.</p>
<button id="btn" type="button">Kliknij mnie</button>

<script>
(function () {
  var W = 50, H = 46, CX = W / 2, PI = Math.PI, sin = Math.sin, cos = Math.cos, AL = 0.2;
  var P = [], N = [], C = [], F = [];

  function add(x, y, z, nx, ny, nz, c, ch) {
    P.push(x, y, z); N.push(nx, ny, nz); C.push(c); F.push(ch || 0);
  }
  // parametric surface with numeric normals; f(u,v) -> [x,y,z], u,v in [0,1]
  function surf(f, nu, nv, c) {
    var e = 1e-3;
    for (var i = 0; i <= nu; i++) for (var j = 0; j <= nv; j++) {
      var u = i / nu, v = j / nv, p = f(u, v);
      var a = f(u + e, v), b = f(u - e, v), d = f(u, v + e), g = f(u, v - e);
      var ux = a[0] - b[0], uy = a[1] - b[1], uz = a[2] - b[2];
      var vx = d[0] - g[0], vy = d[1] - g[1], vz = d[2] - g[2];
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      var l = Math.hypot(nx, ny, nz) || 1;
      add(p[0], p[1], p[2], nx / l, ny / l, nz / l, c);
    }
  }
  function ell(cx, cy, cz, rx, ry, rz, c) {
    surf(function (u, v) {
      var t = u * 2 * PI, p = v * PI;
      return [cx + rx * sin(p) * cos(t), cy + ry * cos(p), cz + rz * sin(p) * sin(t)];
    }, 26, 16, c);
  }

  // [outward angle, radius from axis, base height, tilt, colour]
  var heads = [[0, 0, 32, 0, 0], [0.5, 6, 28, 0.3, 1], [2.2, 6.5, 30.5, 0.28, 2], [3.8, 6, 27, 0.3, 3], [5.4, 6.5, 29.5, 0.28, 4]];

  heads.forEach(function (h, idx) {
    var ox = cos(h[0]), oz = sin(h[0]), bx = h[1] * ox, by = h[2], bz = h[1] * oz, t = h[3], R = 3.3, Hh = 7.8;
    function place(x, y, z) {
      var a = x * ox + z * oz, b = -x * oz + z * ox;
      var a2 = a * cos(t) + y * sin(t), y2 = y * cos(t) - a * sin(t);
      return [bx + a2 * ox - b * oz, by + y2, bz + a2 * oz + b * ox];
    }
    function petal(k) {
      var inner = k % 2, base = k * PI / 3, Rr = R * (inner ? 0.86 : 1), hw = PI / 3 * (inner ? 1.2 : 1.25);
      surf(function (u, v) {
        var w = hw * Math.sqrt(Math.abs(1 - Math.pow(u, 4)));
        var an = base + v * 2 * w - w;
        var r = Rr * Math.pow(Math.abs(sin(PI * (0.1 + 0.78 * u))), 0.75) * (1 - 0.14 * (2 * v - 1) * (2 * v - 1));
        if (!inner) { var q = Math.max(0, u - 0.8); r += 6 * q * q; }
        return place(r * cos(an), u * Hh * (inner ? 0.93 : 1), r * sin(an));
      }, 32, 26, idx);
    }
    for (var k = 0; k < 6; k++) petal(k);
    // stem
    surf(function (u, a) {
      var bow = 1.1 * sin(PI * u), ang = a * 2 * PI;
      return [bx * u - bow * oz + 0.5 * cos(ang), 8 + (by - 8) * u, bz * u + bow * ox + 0.5 * sin(ang)];
    }, 100, 9, 9);
  });

  // leaves
  function leaf(phi, len, ext) {
    var c = cos(phi), s = sin(phi);
    surf(function (u, v) {
      var r = 2 + (10 + ext) * u - 3 * u * u, y = 15 + len * u - 5 * u * u;
      var vv = (v - 0.5) * 2, w = 2.3 * Math.pow(Math.abs(sin(PI * u)), 0.6);
      var lat = vv * w;
      return [r * c - lat * s, y - Math.abs(vv) * w * 0.5, r * s + lat * c];
    }, 70, 20, 5);
  }
  [0.2, 1.3, 2.4, 3.5, 4.5, 5.5].forEach(function (p, i) { leaf(p, 15 + (i % 3) * 2, (i % 2) * 1.5); });

  // paper cone with crinkles
  surf(function (u, v) {
    var an = u * 2 * PI, r = 2 + 7 * v + 0.5 * v * sin(7 * an) + 0.25 * v * sin(13 * an);
    return [r * cos(an), 2 + v * (15 + 0.9 * sin(5 * an)), r * sin(an)];
  }, 160, 38, 6);

  // ribbon ring, bow and tails
  surf(function (u, a) {
    var an = u * 2 * PI, t = a * 2 * PI;
    return [(6.1 + 0.45 * cos(t)) * cos(an), 9.5 + 0.45 * sin(t), (6.1 + 0.45 * cos(t)) * sin(an)];
  }, 160, 8, 7);
  ell(7.2, 9.9, 2.0, 0.7, 1.6, 1.5, 7);
  ell(7.2, 9.9, -2.0, 0.7, 1.6, 1.5, 7);
  ell(6.9, 9.5, 0, 0.8, 0.8, 0.8, 7);
  [1, -1].forEach(function (sg) {
    surf(function (u, v) {
      return [6.6 - 2.9 * u, 9.3 - 5 * u, sg * (0.3 + 1.9 * u) + (v - 0.5) * 1.1];
    }, 30, 6, 7);
  });

  // baby's breath
  var sd = 7;
  function rnd() { sd = (sd * 16807) % 2147483647; return sd / 2147483647; }
  for (var q = 0; q < 18; q++) {
    var ph = rnd() * 2 * PI, tr = 4 + rnd() * 8, ty = 21 + rnd() * 15, cs = cos(ph), sn = sin(ph);
    for (var t = 0; t <= 1; t += 0.012) add((1.5 + (tr - 1.5) * t) * cs, 15 + (ty - 15) * t, (1.5 + (tr - 1.5) * t) * sn, 0, 1, 0, 8, 46);
    for (var m = 0; m < 16; m++) add(tr * cs + (rnd() - 0.5) * 2.2, ty + (rnd() - 0.5) * 2.2, tr * sn + (rnd() - 0.5) * 2.2, 0, 1, 0, 8, 42);
  }

  P = new Float32Array(P); N = new Float32Array(N); C = new Uint8Array(C); F = new Uint8Array(F);
  var n = C.length, ramp = ".,:;-=+*#%@", zb = new Float32Array(W * H), id = new Int32Array(W * H);
  var pre = document.getElementById('bouquet');

  function frame(th) {
    zb.fill(-1e9); id.fill(-1);
    var a = cos(th), b = sin(th), ca = cos(AL), sa = sin(AL);
    for (var i = 0; i < n; i++) {
      var x = P[3 * i], y = P[3 * i + 1] - 20, z = P[3 * i + 2];
      var x1 = a * x + b * z, z1 = -b * x + a * z;
      var col = Math.round(CX + x1 * 1.8), row = Math.round(H - 3 - (ca * y - sa * z1 + 20));
      if (col < 0 || col >= W || row < 0 || row >= H) continue;
      var k = row * W + col, z2 = sa * y + ca * z1;
      if (z2 > zb[k]) { zb[k] = z2; id[k] = i; }
    }
    // light (view space) -> object space
    var Lx = -0.45, Ly = 0.65, Lz = 0.6, ly1 = ca * Ly + sa * Lz, lz1 = -sa * Ly + ca * Lz;
    var lx = a * Lx - b * lz1, lz = b * Lx + a * lz1, ly = ly1;
    var s = '';
    for (var r = 0; r < H; r++) {
      var cur = -1, buf = '';
      for (var c = 0; c < W; c++) {
        var p = id[r * W + c], cl = -1, ch = ' ';
        if (p >= 0) {
          cl = C[p];
          if (F[p]) ch = String.fromCharCode(F[p]);
          else {
            var br = 0.2 + 0.8 * Math.abs(N[3 * p] * lx + N[3 * p + 1] * ly + N[3 * p + 2] * lz);
            ch = ramp[Math.min(10, Math.floor(br * 11))];
          }
        }
        if (cl !== cur) {
          if (buf) s += cur >= 0 ? '<i class="c' + cur + '">' + buf + '</i>' : buf;
          cur = cl; buf = '';
        }
        buf += ch;
      }
      if (buf) s += cur >= 0 ? '<i class="c' + cur + '">' + buf + '</i>' : buf;
      s += '\n';
    }
    pre.innerHTML = s;
  }

  function fit() {
    var avail = Math.min(window.innerWidth - 32, 560);
    pre.style.fontSize = '20px';
    var w = pre.getBoundingClientRect().width;
    if (w > 0) pre.style.fontSize = Math.min(22, 20 * avail / w) + 'px';
  }

  var theta = 0.6, last = 0, still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  frame(theta); fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  function loop(now) {
    if (now - last > 33) {
      theta += Math.min(0.1, (now - last) / 1000) * 0.05;
      last = now; frame(theta);
    }
    requestAnimationFrame(loop);
  }
  if (!still) requestAnimationFrame(loop);

  var pal = 0;
  function change() {
    pal = (pal + 1) % 3;
    if (pal === 0) document.documentElement.removeAttribute('data-pal');
    else document.documentElement.setAttribute('data-pal', String(pal));
  }
  pre.addEventListener('click', change);
  pre.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); change(); } });
  document.getElementById('btn').addEventListener('click', change);
})();
</script>

</body>
</html>
